name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          configured_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "$version" != "$configured_version" ]; then
            echo "Tag version $version does not match mod_version $configured_version." >&2
            exit 1
          fi
          awk -v version="$version" '
            $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md

      - name: Build server bundle
        run: ./gradlew serverBundle

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          files=(
            "build/libs/craftbalance-${version}.jar"
            "build/libs/craftbalance-${version}.jar.sha256"
            "build/distributions/craftbalance-${version}-server-bundle.zip"
            "build/distributions/craftbalance-${version}-server-bundle.zip.sha256"
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "Missing release asset: $file" >&2; exit 1; }
          done
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "CraftBalance $version" \
            --notes-file release-notes.md \
            "${files[@]}"
