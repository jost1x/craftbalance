name: craftbalance-staging

services:
  minecraft:
    image: itzg/minecraft-server:java21
    container_name: craftbalance-staging
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2
    ports:
      - "25565:25565/tcp"
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "1.21.1"
      FABRIC_LOADER_VERSION: "0.16.10"
      MODRINTH_PROJECTS: fabric-api
      MEMORY: 2G
      ONLINE_MODE: "false"
      MAX_PLAYERS: "20"
      VIEW_DISTANCE: "5"
      SIMULATION_DISTANCE: "4"
      ENFORCE_SECURE_PROFILE: "false"
      MOTD: CraftBalance-Staging
    volumes:
      - ./data:/data
    networks:
      craftbalance-staging-net:
        aliases:
          - minecraft

networks:
  craftbalance-staging-net:
    external: true
